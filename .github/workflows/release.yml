name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Update manifest version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json'));m.version='$VERSION';fs.writeFileSync('manifest.json',JSON.stringify(m,null,2)+'\n');let v={};try{v=JSON.parse(fs.readFileSync('versions.json'))}catch(e){};v['$VERSION']=m.minAppVersion;fs.writeFileSync('versions.json',JSON.stringify(v,null,2)+'\n');"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes main.js manifest.json styles.css
